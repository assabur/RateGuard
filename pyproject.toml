[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "rateguard"
version = "0.1.0"
description = "Auditable US Treasury yield monitoring and FRED reconciliation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28,<1",
  "defusedxml>=0.7.1,<1",
  "pandas>=2.2,<4",
  "pyarrow>=19,<24",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
rateguard = "rateguard.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
